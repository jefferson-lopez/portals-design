name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.101.0

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID_VARIABLE: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_PROJECT_ID_SECRET: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          SUPABASE_PROJECT_ID="${SUPABASE_PROJECT_ID_VARIABLE:-$SUPABASE_PROJECT_ID_SECRET}"

          if [[ -z "$SUPABASE_PROJECT_ID" ]]; then
            echo "::error::SUPABASE_PROJECT_ID is missing. Add it to the production environment as a GitHub Actions variable or secret."
            exit 1
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
